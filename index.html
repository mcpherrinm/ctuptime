<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CT Uptime</title>
<link rel="stylesheet" href="dist/uPlot.min.css">
<script src="dist/uPlot.iife.min.js"></script>
<style>
  html, body { height: 100%; }
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 1em;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  #errors { color: #b00; white-space: pre-wrap; margin-bottom: 0.5em; }
  #errors:empty { display: none; }

  .main-row {
    display: flex;
    gap: 1em;
    align-items: stretch;
    flex: 1;
    min-height: 0;
  }
  #sidebar {
    flex: 0 0 24em;
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    min-height: 0;
  }
  #sidebar h1 { margin: 0; font-size: 1.2em; white-space: nowrap; }
  #sidebar h2 { font-size: 0.95em; margin: 0.4em 0 0; }
  #sidebar > label { display: flex; align-items: center; gap: 0.4em; font-size: 0.9em; }
  #sidebar > label > span { display: inline-block; width: 3em; }
  #sidebar > label > input { flex: 1; min-width: 0; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  #chart { flex: 1; min-height: 0; width: 100%; }

  #logs-filter { padding: 0.3em; font: inherit; }
  #logs-list { overflow-y: auto; flex: 1; min-height: 0; }
  #logs-list ul { list-style: none; margin: 0; padding: 0; }
  #logs-list > ul > li + li { margin-top: 0.2em; }
  .op-row { display: block; padding: 0.15em 0; cursor: pointer; font-size: 0.9em; font-weight: 600; }
  .op-row input { margin-right: 0.4em; vertical-align: middle; }
  .op-children { padding-left: 1.4em; }
  .log-row { display: flex; align-items: center; gap: 0.4em; padding: 0.1em 0; cursor: pointer; font-size: 0.9em; }
  .log-row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swatches { display: inline-flex; gap: 2px; flex-wrap: wrap; max-width: 6em; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #bbb;
    padding: 0.3em 0.5em;
    border-radius: 3px;
    font-size: 0.85em;
    white-space: nowrap;
    z-index: 10;
    display: none;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    line-height: 1.4;
  }
  .chart-tooltip .tt-row { display: flex; align-items: center; gap: 0.4em; }
  .chart-tooltip .tt-swatch { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
  .logs-actions { display: flex; gap: 0.5em; }
  .logs-actions button { font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="main-row">
  <aside id="sidebar">
    <h1>🪵⏰ CT Uptime</h1>
    <label><span>From</span> <input id="from" type="datetime-local"></label>
    <label><span>To</span> <input id="to" type="datetime-local"></label>
    <h2 id="logs-heading">Logs (0)</h2>
    <input id="logs-filter" type="search" placeholder="Filter logs…" aria-label="Filter logs">
    <div class="logs-actions">
      <button type="button" id="logs-all">All visible</button>
      <button type="button" id="logs-none">None visible</button>
      <button type="button" id="logs-clear">Clear all</button>
    </div>
    <div id="logs-list"></div>
  </aside>
  <div id="main">
    <div id="errors"></div>
    <div id="chart"></div>
  </div>
</div>

<script>
const logsHeading = document.getElementById("logs-heading");
const logsList = document.getElementById("logs-list");
const logsFilter = document.getElementById("logs-filter");
const fromInp = document.getElementById("from");
const toInp = document.getElementById("to");
const chartDiv = document.getElementById("chart");
const errorsDiv = document.getElementById("errors");

let allLogPaths = [];
const selectedLogs = new Set();
const SELECTED_LOGS_KEY = "ctuptime.selectedLogs";

function saveSelectedLogs() {
  try {
    localStorage.setItem(SELECTED_LOGS_KEY, JSON.stringify(Array.from(selectedLogs)));
  } catch {}
}

function updateLogsHeading() {
  logsHeading.textContent = `Logs (${selectedLogs.size})`;
}

function groupByOperator(paths) {
  const groups = new Map();
  for (const p of paths) {
    const op = operatorFor(p);
    if (!groups.has(op)) groups.set(op, []);
    groups.get(op).push(p);
  }
  return new Map(
    Array.from(groups.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([op, ps]) => [op, ps.sort((a, b) => logLabel(a).localeCompare(logLabel(b)))])
  );
}

function renderLogsList() {
  const visible = visiblePaths();
  const groups = groupByOperator(visible);
  logsList.innerHTML = "";
  const ul = document.createElement("ul");
  for (const [op, paths] of groups) {
    const li = document.createElement("li");
    const opLabel = document.createElement("label");
    opLabel.className = "op-row";
    const opCb = document.createElement("input");
    opCb.type = "checkbox";
    const selCount = paths.filter(p => selectedLogs.has(p)).length;
    opCb.checked = selCount === paths.length;
    opCb.indeterminate = selCount > 0 && selCount < paths.length;
    opCb.addEventListener("change", () => {
      const turnOn = opCb.checked;
      for (const p of paths) {
        if (turnOn) selectedLogs.add(p);
        else selectedLogs.delete(p);
      }
      saveSelectedLogs();
      renderLogsList();
      updateLogsHeading();
      render();
    });
    opLabel.append(opCb, document.createTextNode(`${op} (${paths.length})`));
    li.appendChild(opLabel);

    const childUl = document.createElement("ul");
    childUl.className = "op-children";
    for (const p of paths) {
      const childLi = document.createElement("li");
      const row = document.createElement("label");
      row.className = "log-row";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = selectedLogs.has(p);
      cb.addEventListener("change", () => {
        if (cb.checked) selectedLogs.add(p);
        else selectedLogs.delete(p);
        saveSelectedLogs();
        renderLogsList();
        updateLogsHeading();
        render();
      });
      row.dataset.path = p;
      const labelSpan = document.createElement("span");
      labelSpan.className = "label";
      labelSpan.textContent = logLabel(p);
      const swatches = document.createElement("span");
      swatches.className = "swatches";
      row.append(cb, labelSpan, swatches);
      childLi.appendChild(row);
      childUl.appendChild(childLi);
    }
    li.appendChild(childUl);
    ul.appendChild(li);
  }
  logsList.appendChild(ul);
  populateSidebarSwatches();
}

function visiblePaths() {
  const q = logsFilter.value.trim().toLowerCase();
  if (!q) return allLogPaths.slice();
  return allLogPaths.filter(p =>
    logLabel(p).toLowerCase().includes(q) || operatorFor(p).toLowerCase().includes(q)
  );
}

const cache = new Map();
let plot = null;

function clearErrors() { errorsDiv.textContent = ""; }
function showError(msg) {
  errorsDiv.textContent += (errorsDiv.textContent ? "\n" : "") + msg;
}
window.addEventListener("error", e => showError("JS error: " + e.message));
window.addEventListener("unhandledrejection", e => showError("Unhandled: " + (e.reason && e.reason.message || e.reason)));

function logLabel(path) {
  // path like "data/https:%2F%2Fhost%2Fpath%2F.csv"
  const file = path.replace(/^data\//, "").replace(/\.csv$/, "");
  return decodeURIComponent(file);
}

function operatorFor(path) {
  try {
    const u = new URL(logLabel(path));
    const parts = u.hostname.split(".");
    if (parts.length < 2) return u.hostname;
    return parts.slice(-2).join(".");
  } catch {
    return "(unknown)";
  }
}

async function fetchCsv(path) {
  if (cache.has(path)) return cache.get(path);
  // Filenames on disk contain literal "%2F" etc.; double-encode the "%" so
  // servers that decode the request path once still find the file.
  const url = path.replace(/%/g, "%25");
  const resp = await fetch(url);
  if (!resp.ok) {
    throw new Error(`${resp.status} ${resp.statusText} for ${url}`);
  }
  const text = await resp.text();
  const lines = text.trim().split("\n");
  const header = lines[0].split(",");
  const rows = lines.slice(1).map(line => line.split(",").map((v, i) => i === 0 ? Number(v) : (v === "" ? null : Number(v))));
  const parsed = { header, rows };
  cache.set(path, parsed);
  return parsed;
}

function toLocalInput(unix) {
  const d = new Date(unix * 1000);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function inputToUnix(s) {
  if (!s) return null;
  return Math.floor(new Date(s).getTime() / 1000);
}

async function render() {
  clearErrors();
  const selected = Array.from(selectedLogs);
  if (plot) { plot.destroy(); plot = null; }
  chartDiv.innerHTML = "";
  populateSidebarSwatches();
  if (selected.length === 0) return;

  const results = await Promise.all(selected.map(p =>
    fetchCsv(p).then(d => ({ path: p, data: d }), err => ({ path: p, err }))
  ));
  for (const r of results) {
    if (r.err) showError(`Loading ${logLabel(r.path)}: ${r.err.message}`);
  }
  const ok = results.filter(r => r.data);
  if (ok.length === 0) return;
  ok.sort((a, b) => {
    const opCmp = operatorFor(a.path).localeCompare(operatorFor(b.path));
    return opCmp !== 0 ? opCmp : logLabel(a.path).localeCompare(logLabel(b.path));
  });
  const datasets = ok.map(r => r.data);
  const okPaths = ok.map(r => r.path);

  // Build a union of timestamps across all selected datasets.
  const tsSet = new Set();
  for (const d of datasets) {
    for (const r of d.rows) tsSet.add(r[0]);
  }
  let timestamps = Array.from(tsSet).sort((a, b) => a - b);

  const from = inputToUnix(fromInp.value);
  const to = inputToUnix(toInp.value);
  timestamps = timestamps.filter(t => (from == null || t >= from) && (to == null || t <= to));
  if (timestamps.length === 0) return;

  const xMin = from != null ? from : timestamps[0];
  const xMax = to != null ? to : timestamps[timestamps.length - 1];

  const tsIndex = new Map(timestamps.map((t, i) => [t, i]));

  const series = [{}]; // x-axis placeholder
  const data = [timestamps];
  // Plot positions on the log-downtime axis:
  //   true 100% uptime  -> 0.0001 (a dedicated "100%" gridline above the decades)
  //   anything else     -> max(0.001, 100 - uptime), so 99.9...% values stay at
  //                        or below the "99.999%" gridline and never collide
  //                        visually with true 100%.
  const TOP_100 = 0.0001;
  const NINES_FLOOR = 0.001;

  for (let di = 0; di < datasets.length; di++) {
    const d = datasets[di];
    const label = logLabel(okPaths[di]);
    const rowByTs = new Map(d.rows.map(r => [r[0], r]));
    for (let ci = 1; ci < d.header.length; ci++) {
      const endpoint = d.header[ci];
      const ys = new Array(timestamps.length).fill(null);
      const uptimes = new Array(timestamps.length).fill(null);
      for (const t of timestamps) {
        const r = rowByTs.get(t);
        if (r) {
          const uptime = r[ci];
          if (uptime != null) {
            uptimes[tsIndex.get(t)] = uptime;
            ys[tsIndex.get(t)] = uptime >= 100 ? TOP_100 : Math.max(NINES_FLOOR, 100 - uptime);
          }
        }
      }
      series.push({
        label: `${label} ${endpoint}`,
        stroke: colorFor(di, ci),
        spanGaps: true,
        _path: okPaths[di],
        _endpoint: endpoint,
        _uptimes: uptimes,
      });
      data.push(ys);
    }
  }

  let focusedIdx = null;
  const tooltip = document.createElement("div");
  tooltip.className = "chart-tooltip";

  const opts = {
    width: chartDiv.clientWidth || 900,
    height: chartDiv.clientHeight || 500,
    series,
    legend: { show: false },
    cursor: {
      focus: { prox: 30 },
    },
    scales: {
      x: { time: true, range: [xMin, xMax] },
      y: { distr: 3, log: 10, dir: -1, range: [0.0001, 100] },
    },
    axes: [{}, {
      size: 70,
      splits: () => [0.0001, 0.001, 0.01, 0.1, 1, 10, 100],
      values: (u, splits) => splits.map(t => {
        if (t <= 0.0001) return "100%";
        const up = 100 - t;
        if (up <= 0) return "0%";
        return parseFloat(up.toPrecision(6)) + "%";
      }),
    }],
    hooks: {
      ready: [u => {
        u.over.appendChild(tooltip);
        u.over.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
      }],
      setSeries: [(u, sidx, o) => {
        if (o.focus !== undefined) {
          focusedIdx = o.focus ? sidx : (focusedIdx === sidx ? null : focusedIdx);
          updateTooltip(u);
        }
      }],
      setCursor: [updateTooltip],
    },
  };

  function updateTooltip(u) {
    if (focusedIdx == null || u.cursor.left == null || u.cursor.left < 0) {
      tooltip.style.display = "none";
      return;
    }
    const idx = u.cursor.idx;
    if (idx == null) { tooltip.style.display = "none"; return; }
    const s = u.series[focusedIdx];
    const uptime = s._uptimes ? s._uptimes[idx] : null;
    if (uptime == null) { tooltip.style.display = "none"; return; }
    const ts = u.data[0][idx];
    tooltip.innerHTML = "";
    const tsRow = document.createElement("div");
    tsRow.className = "tt-row";
    tsRow.textContent = new Date(ts * 1000).toLocaleString();
    const logRow = document.createElement("div");
    logRow.className = "tt-row";
    const sw = document.createElement("span");
    sw.className = "tt-swatch";
    sw.style.background = s.stroke;
    const logText = document.createElement("span");
    logText.textContent = logLabel(s._path);
    logRow.append(sw, logText);
    const epRow = document.createElement("div");
    epRow.className = "tt-row";
    epRow.textContent = `${s._endpoint}: ${formatUptime(uptime)}`;
    tooltip.append(tsRow, logRow, epRow);
    tooltip.style.display = "block";
    const ttW = tooltip.offsetWidth;
    const ttH = tooltip.offsetHeight;
    const overW = u.over.clientWidth;
    const overH = u.over.clientHeight;
    let left = u.cursor.left + 14;
    let top = u.cursor.top + 14;
    if (left + ttW > overW) left = u.cursor.left - ttW - 14;
    if (top + ttH > overH) top = u.cursor.top - ttH - 14;
    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
  }

  plot = new uPlot(opts, data, chartDiv);
  populateSidebarSwatches();
}

function formatUptime(up) {
  if (up >= 100) return "100%";
  return parseFloat(up.toPrecision(8)) + "%";
}

function populateSidebarSwatches() {
  logsList.querySelectorAll(".swatches").forEach(el => { el.innerHTML = ""; });
  if (!plot) return;
  const byPath = new Map();
  for (let i = 1; i < plot.series.length; i++) {
    const s = plot.series[i];
    if (!s._path) continue;
    if (!byPath.has(s._path)) byPath.set(s._path, []);
    byPath.get(s._path).push(s.stroke);
  }
  for (const [path, colors] of byPath) {
    const row = logsList.querySelector(`.log-row[data-path="${CSS.escape(path)}"] .swatches`);
    if (!row) continue;
    for (const c of colors) {
      const sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = c;
      row.appendChild(sw);
    }
  }
}

function colorFor(logIdx, endpointIdx) {
  // distinct-ish colors via HSL
  const hue = (logIdx * 67 + endpointIdx * 23) % 360;
  return `hsl(${hue}, 70%, 45%)`;
}

async function init() {
  const resp = await fetch("index.json");
  if (!resp.ok) {
    showError(`Loading index.json: ${resp.status} ${resp.statusText}`);
    return;
  }
  const idx = await resp.json();
  allLogPaths = Object.keys(idx).sort();

  let stored = null;
  try {
    const raw = localStorage.getItem(SELECTED_LOGS_KEY);
    if (raw != null) stored = JSON.parse(raw);
  } catch {}
  if (Array.isArray(stored)) {
    const known = new Set(allLogPaths);
    for (const p of stored) if (known.has(p)) selectedLogs.add(p);
  } else {
    for (const p of allLogPaths) selectedLogs.add(p);
    saveSelectedLogs();
  }
  renderLogsList();
  updateLogsHeading();
  render();

  const now = Math.floor(Date.now() / 1000);
  fromInp.value = toLocalInput(now - 7 * 86400);
  toInp.value = toLocalInput(now);

  logsFilter.addEventListener("input", renderLogsList);
  document.getElementById("logs-all").addEventListener("click", () => {
    for (const p of visiblePaths()) selectedLogs.add(p);
    saveSelectedLogs();
    renderLogsList();
    updateLogsHeading();
    render();
  });
  document.getElementById("logs-none").addEventListener("click", () => {
    for (const p of visiblePaths()) selectedLogs.delete(p);
    saveSelectedLogs();
    renderLogsList();
    updateLogsHeading();
    render();
  });
  document.getElementById("logs-clear").addEventListener("click", () => {
    selectedLogs.clear();
    saveSelectedLogs();
    renderLogsList();
    updateLogsHeading();
    render();
  });
  fromInp.addEventListener("change", render);
  toInp.addEventListener("change", render);
  window.addEventListener("resize", render);
}

init();
</script>
</body>
</html>
