<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CT Uptime</title>
<link rel="stylesheet" href="dist/uPlot.min.css">
<script src="dist/uPlot.iife.min.js"></script>
<style>
  html, body { height: 100%; }
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 1em;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  #errors { color: #b00; white-space: pre-wrap; margin-bottom: 0.5em; }
  #errors:empty { display: none; }

  .main-row {
    display: flex;
    gap: 1em;
    align-items: stretch;
    flex: 1;
    min-height: 0;
  }
  #sidebar {
    flex: 0 0 24em;
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }
  #sidebar-resizer {
    flex: 0 0 6px;
    cursor: col-resize;
    background: transparent;
    border-left: 1px solid #ddd;
    margin: 0 -2px;
  }
  #sidebar-resizer:hover, #sidebar-resizer.dragging { border-left-color: #888; }
  body.resizing-sidebar { cursor: col-resize; user-select: none; }
  #sidebar h1 { margin: 0; font-size: 1.2em; white-space: nowrap; }
  #sidebar h2 { font-size: 0.95em; margin: 0.4em 0 0; }
  #sidebar > label { display: flex; align-items: center; gap: 0.4em; font-size: 0.9em; }
  #sidebar > label > span { display: inline-block; width: 3em; }
  #sidebar > label > input { flex: 1; min-width: 0; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  #chart { flex: 1; min-height: 0; width: 100%; }

  .range-links { font-size: 0.85em; color: #555; }
  .range-links a { color: #06c; cursor: pointer; text-decoration: none; }
  .range-links a:hover { text-decoration: underline; }

  #logs-list { overflow-y: auto; flex: 1; min-height: 0; }
  #logs-list ul { list-style: none; margin: 0; padding: 0; }
  #logs-list > ul > li + li { margin-top: 0.2em; }
  .logs-head { display: flex; align-items: baseline; gap: 0.6em; flex-wrap: wrap; }
  .logs-head label { display: flex; align-items: center; gap: 0.3em; font-size: 0.85em; cursor: pointer; }

  /* operator > log > endpoint tree */
  .tree-row { display: flex; align-items: center; gap: 0.3em; padding: 0.1em 0; font-size: 0.9em; }
  .tree-row > label { display: flex; align-items: center; gap: 0.4em; flex: 1; min-width: 0; cursor: pointer; }
  .tree-row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .op-row { font-weight: 600; }
  .ep-row { font-size: 0.85em; color: #444; }
  .tree-row .range {
    flex: 0 0 auto;
    margin-left: 0.4em;
    font-size: 0.85em;
    font-weight: normal;
    color: #777;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  /* Indent each level, with a guide line running under the parent's twisty.
     Needs the #logs-list prefix to outrank "#logs-list ul { padding: 0 }". */
  #logs-list .children {
    margin-left: 0.6em;
    padding-left: 1em;
    border-left: 1px solid #e2e2e2;
  }
  .twisty {
    flex: 0 0 1.2em; padding: 0; border: 0; background: none; font: inherit;
    line-height: 1; color: #666; cursor: pointer;
  }
  .twisty[hidden] { visibility: hidden; display: block; }
  .tree-note { padding-left: 1.5em; font-size: 0.85em; color: #888; }
  /* Rows contributing nothing to the current view (out of range, or filtered out). */
  .tree-row.no-data .label { color: #aaa; }
  .swatches { display: inline-flex; gap: 2px; flex-wrap: wrap; max-width: 6em; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #bbb;
    padding: 0.3em 0.5em;
    border-radius: 3px;
    font-size: 0.85em;
    white-space: nowrap;
    z-index: 10;
    display: none;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    line-height: 1.4;
  }
  .chart-tooltip .tt-row { display: flex; align-items: center; gap: 0.4em; }
  .chart-tooltip .tt-swatch { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
  .logs-actions { display: flex; gap: 0.5em; }
  .logs-actions button { font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="main-row">
  <aside id="sidebar">
    <h1>🪵⏰ CT Uptime</h1>
    <label><span>From</span> <input id="from" type="datetime-local"></label>
    <label><span>To</span> <input id="to" type="datetime-local"></label>
    <div class="range-links" id="range-links">
      Last <a data-range="week">Week</a>,
      <a data-range="month">Month</a>,
      <a data-range="3months">3 Months</a>,
      <a data-range="year">Year</a>
    </div>
    <div class="logs-head">
      <h2 id="logs-heading">Logs (0)</h2>
      <label><input type="checkbox" id="hide-high"> Hide data &gt; 99.99%</label>
    </div>
    <div class="logs-actions">
      <button type="button" id="logs-all">Show all</button>
      <button type="button" id="logs-none">Hide all</button>
    </div>
    <div id="logs-list"></div>
  </aside>
  <div id="sidebar-resizer"></div>
  <div id="main">
    <div id="errors"></div>
    <div id="chart"></div>
  </div>
</div>

<script>
const logsHeading = document.getElementById("logs-heading");
const logsList = document.getElementById("logs-list");
const hideHighInp = document.getElementById("hide-high");
const fromInp = document.getElementById("from");
const toInp = document.getElementById("to");
const chartDiv = document.getElementById("chart");
const errorsDiv = document.getElementById("errors");
const sidebar = document.getElementById("sidebar");
const sidebarResizer = document.getElementById("sidebar-resizer");
const SIDEBAR_WIDTH_KEY = "ctuptime.sidebarWidth";
const SIDEBAR_MIN = 180;
const SIDEBAR_MAX_FRAC = 0.7;

(function initSidebarResize() {
  const stored = parseFloat(localStorage.getItem(SIDEBAR_WIDTH_KEY));
  if (Number.isFinite(stored) && stored >= SIDEBAR_MIN) {
    sidebar.style.flex = `0 0 ${stored}px`;
  }
  let dragging = false;
  sidebarResizer.addEventListener("mousedown", e => {
    dragging = true;
    sidebarResizer.classList.add("dragging");
    document.body.classList.add("resizing-sidebar");
    e.preventDefault();
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    const parentLeft = sidebar.parentElement.getBoundingClientRect().left;
    const max = window.innerWidth * SIDEBAR_MAX_FRAC;
    const w = Math.max(SIDEBAR_MIN, Math.min(max, e.clientX - parentLeft));
    sidebar.style.flex = `0 0 ${w}px`;
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    sidebarResizer.classList.remove("dragging");
    document.body.classList.remove("resizing-sidebar");
    const w = sidebar.getBoundingClientRect().width;
    try { localStorage.setItem(SIDEBAR_WIDTH_KEY, String(Math.round(w))); } catch {}
    render();
  });
})();

let allLogPaths = [];
let operatorGroups = new Map();  // operator -> its paths, both in display order
// A log is shown when it's in selectedLogs; individual endpoints of it can then
// be switched off. An empty (or absent) hidden set means "all endpoints".
const selectedLogs = new Set();
const hiddenEndpoints = new Map();  // path -> Set of endpoint names
// Which tree nodes are open. Everything starts collapsed.
const expandedOps = new Set();
const expandedLogs = new Set();
const EMPTY = new Set();
const SELECTED_LOGS_KEY = "ctuptime.selectedLogs";
const HIDDEN_ENDPOINTS_KEY = "ctuptime.hiddenEndpoints";
const HIDE_HIGH_KEY = "ctuptime.hideHigh";
// Uptimes strictly above this are dropped when "Hide data > 99.99%" is on.
const HIDE_ABOVE = 99.99;

function saveSelection() {
  try {
    localStorage.setItem(SELECTED_LOGS_KEY, JSON.stringify(Array.from(selectedLogs)));
    const hidden = {};
    for (const [p, eps] of hiddenEndpoints) if (eps.size) hidden[p] = Array.from(eps);
    localStorage.setItem(HIDDEN_ENDPOINTS_KEY, JSON.stringify(hidden));
  } catch {}
}

// Endpoint names come from the CSV header, so they're only known once fetched.
function endpointsFor(path) {
  const d = cache.get(path);
  return d ? d.header.slice(1) : null;
}

function hiddenFor(path) { return hiddenEndpoints.get(path) || EMPTY; }

function endpointOn(path, endpoint) {
  return selectedLogs.has(path) && !hiddenFor(path).has(endpoint);
}

function logCheckState(path) {
  if (!selectedLogs.has(path)) return "off";
  return hiddenFor(path).size === 0 ? "on" : "partial";
}

function operatorCheckState(paths) {
  let on = 0, partial = 0;
  for (const p of paths) {
    const state = logCheckState(p);
    if (state === "on") on++;
    else if (state === "partial") partial++;
  }
  if (on === paths.length) return "on";
  if (on === 0 && partial === 0) return "off";
  return "partial";
}

// Toggling a log always resets its endpoints, so re-checking it shows all of them.
function setLogSelected(path, on) {
  if (on) selectedLogs.add(path);
  else selectedLogs.delete(path);
  hiddenEndpoints.delete(path);
}

function setEndpointSelected(path, endpoint, on) {
  const endpoints = endpointsFor(path) || [];
  if (on && !selectedLogs.has(path)) {
    // Ticking one endpoint of a hidden log shows that endpoint alone.
    selectedLogs.add(path);
    hiddenEndpoints.set(path, new Set(endpoints.filter(e => e !== endpoint)));
    return;
  }
  const hidden = new Set(hiddenFor(path));
  if (on) hidden.delete(endpoint);
  else hidden.add(endpoint);
  if (endpoints.length && hidden.size >= endpoints.length) setLogSelected(path, false);
  else if (hidden.size) hiddenEndpoints.set(path, hidden);
  else hiddenEndpoints.delete(path);
}

function selectionChanged() {
  saveSelection();
  renderLogsList();
  updateLogsHeading();
  render();
}

function updateLogsHeading() {
  logsHeading.textContent = `Logs (${selectedLogs.size})`;
}

function groupByOperator(paths) {
  const groups = new Map();
  for (const p of paths) {
    const op = operatorFor(p);
    if (!groups.has(op)) groups.set(op, []);
    groups.get(op).push(p);
  }
  return new Map(
    Array.from(groups.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([op, ps]) => [op, ps.sort((a, b) => logLabel(a).localeCompare(logLabel(b)))])
  );
}

// One row of the tree: an expand twisty (or a blank in its place), a checkbox
// that can be tri-state, and a label. opts.onToggle being absent means a leaf.
function treeRow(className, opts) {
  const row = document.createElement("div");
  row.className = `tree-row ${className}`;
  Object.assign(row.dataset, opts.dataset || {});

  const twisty = document.createElement("button");
  twisty.type = "button";
  twisty.className = "twisty";
  if (opts.onToggle) {
    twisty.textContent = opts.expanded ? "▾" : "▸";
    twisty.setAttribute("aria-expanded", String(!!opts.expanded));
    twisty.setAttribute("aria-label", (opts.expanded ? "Collapse " : "Expand ") + opts.text);
    twisty.addEventListener("click", opts.onToggle);
  } else {
    twisty.hidden = true;
  }

  const label = document.createElement("label");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = opts.state === "on";
  cb.indeterminate = opts.state === "partial";
  cb.addEventListener("change", () => opts.onCheck(cb.checked));
  const text = document.createElement("span");
  text.className = "label";
  text.textContent = opts.text;
  label.append(cb, text);

  // Filled in by updateLogRowStates(), which also reacts to time range changes.
  const range = document.createElement("span");
  range.className = "range";

  row.append(twisty, label, range);
  if (opts.swatches) {
    const swatches = document.createElement("span");
    swatches.className = "swatches";
    row.appendChild(swatches);
  }
  return row;
}

function toggleIn(set, key) {
  if (!set.delete(key)) set.add(key);
}

// Expanding a log needs its endpoint names, i.e. its CSV header.
async function toggleLogExpanded(path) {
  toggleIn(expandedLogs, path);
  if (expandedLogs.has(path) && !cache.has(path)) {
    renderLogsList();
    try {
      await fetchCsv(path);
    } catch (err) {
      showError(`Loading ${logLabel(path)}: ${err.message}`);
    }
  }
  renderLogsList();
}

function endpointNode(path, endpoint) {
  const li = document.createElement("li");
  li.appendChild(treeRow("ep-row", {
    dataset: { path, endpoint },
    state: endpointOn(path, endpoint) ? "on" : "off",
    onCheck: on => { setEndpointSelected(path, endpoint, on); selectionChanged(); },
    text: endpoint,
  }));
  return li;
}

function logNode(path) {
  const li = document.createElement("li");
  const expanded = expandedLogs.has(path);
  li.appendChild(treeRow("log-row", {
    dataset: { path },
    expanded,
    onToggle: () => toggleLogExpanded(path),
    state: logCheckState(path),
    onCheck: on => { setLogSelected(path, on); selectionChanged(); },
    text: logLabel(path),
    swatches: true,
  }));
  if (expanded) {
    const ul = document.createElement("ul");
    ul.className = "children";
    const endpoints = endpointsFor(path);
    if (endpoints) {
      for (const ep of endpoints) ul.appendChild(endpointNode(path, ep));
    } else {
      const note = document.createElement("li");
      note.className = "tree-note";
      note.textContent = "loading endpoints…";
      ul.appendChild(note);
    }
    li.appendChild(ul);
  }
  return li;
}

function operatorNode(op, paths) {
  const li = document.createElement("li");
  const expanded = expandedOps.has(op);
  li.appendChild(treeRow("op-row", {
    dataset: { op },
    expanded,
    onToggle: () => { toggleIn(expandedOps, op); renderLogsList(); },
    state: operatorCheckState(paths),
    onCheck: on => {
      for (const p of paths) setLogSelected(p, on);
      selectionChanged();
    },
    text: `${op} (${paths.length})`,
  }));
  if (expanded) {
    const ul = document.createElement("ul");
    ul.className = "children";
    for (const p of paths) ul.appendChild(logNode(p));
    li.appendChild(ul);
  }
  return li;
}

function renderLogsList() {
  logsList.innerHTML = "";
  const ul = document.createElement("ul");
  for (const [op, paths] of operatorGroups) ul.appendChild(operatorNode(op, paths));
  logsList.appendChild(ul);
  populateSidebarSwatches();
  updateLogRowStates();
}

// Whether a log contributes any datapoint to the chart as currently configured:
// some sample inside the time range that survives the >99.99% filter. Pass an
// endpoint to ask about just that column. Logs whose data hasn't been fetched
// yet count as visible, since we can't tell.
function pathHasVisiblePoints(path, from, to, hideHigh, endpoint) {
  const d = cache.get(path);
  if (!d) return true;
  let first = 1, last = d.header.length - 1;
  if (endpoint != null) {
    first = last = d.header.indexOf(endpoint);
    if (first < 1) return false;
  }
  for (const r of d.rows) {
    const t = r[0];
    if ((from != null && t < from) || (to != null && t > to)) continue;
    for (let ci = first; ci <= last; ci++) {
      const uptime = r[ci];
      if (uptime == null) continue;
      if (hideHigh && uptime > HIDE_ABOVE) continue;
      return true;
    }
  }
  return false;
}

// Lowest and highest uptime seen in the time range, for a whole log or one of
// its endpoints. Independent of the >99.99% filter, so a greyed-out row still
// says what it's sitting at. Null when there's no data (or none fetched yet).
function uptimeRange(path, from, to, endpoint) {
  const d = cache.get(path);
  if (!d) return null;
  let first = 1, last = d.header.length - 1;
  if (endpoint != null) {
    first = last = d.header.indexOf(endpoint);
    if (first < 1) return null;
  }
  let min = Infinity, max = -Infinity;
  for (const r of d.rows) {
    const t = r[0];
    if ((from != null && t < from) || (to != null && t > to)) continue;
    for (let ci = first; ci <= last; ci++) {
      const uptime = r[ci];
      if (uptime == null) continue;
      if (uptime < min) min = uptime;
      if (uptime > max) max = uptime;
    }
  }
  return min === Infinity ? null : { min, max };
}

function mergeRanges(ranges) {
  let merged = null;
  for (const r of ranges) {
    if (!r) continue;
    if (!merged) merged = { min: r.min, max: r.max };
    else {
      merged.min = Math.min(merged.min, r.min);
      merged.max = Math.max(merged.max, r.max);
    }
  }
  return merged;
}

// "99.4% - 100.0%", collapsed to one value when both ends round the same.
function formatRange(range) {
  if (!range) return "";
  const lo = range.min.toFixed(1), hi = range.max.toFixed(1);
  return lo === hi ? `${lo}%` : `${lo}% - ${hi}%`;
}

// Grey out rows with nothing to show: endpoints and logs with no datapoints in
// the current view, and operators none of whose logs have any. Also refreshes
// each row's uptime range, which moves with the time range.
function updateLogRowStates() {
  const from = inputToUnix(fromInp.value);
  const to = inputToUnix(toInp.value);
  const hideHigh = hideHighInp.checked;
  const memo = new Map();
  const rangeFor = (path, endpoint) => {
    const key = endpoint == null ? path : `${path}␀${endpoint}`;
    if (!memo.has(key)) memo.set(key, uptimeRange(path, from, to, endpoint));
    return memo.get(key);
  };
  const setRange = (row, range) => { row.querySelector(".range").textContent = formatRange(range); };
  for (const row of logsList.querySelectorAll(".tree-row[data-path]")) {
    const { path, endpoint } = row.dataset;
    row.classList.toggle("no-data", !pathHasVisiblePoints(path, from, to, hideHigh, endpoint));
    setRange(row, rangeFor(path, endpoint));
  }
  for (const row of logsList.querySelectorAll(".tree-row[data-op]")) {
    const paths = operatorGroups.get(row.dataset.op) || [];
    const anyVisible = paths.some(p => pathHasVisiblePoints(p, from, to, hideHigh));
    row.classList.toggle("no-data", paths.length > 0 && !anyVisible);
    setRange(row, mergeRanges(paths.map(p => rangeFor(p))));
  }
}

const cache = new Map();
let plot = null;
// Bumped by each render() so an in-flight one can bail if superseded (renders
// overlap when e.g. a resize lands while the first fetch is still going).
let renderSeq = 0;

function clearErrors() { errorsDiv.textContent = ""; }
function showError(msg) {
  errorsDiv.textContent += (errorsDiv.textContent ? "\n" : "") + msg;
}
window.addEventListener("error", e => showError("JS error: " + e.message));
window.addEventListener("unhandledrejection", e => showError("Unhandled: " + (e.reason && e.reason.message || e.reason)));

function logLabel(path) {
  // path like "data/https:%2F%2Fhost%2Fpath%2F.csv"
  const file = path.replace(/^data\//, "").replace(/\.csv$/, "");
  return decodeURIComponent(file);
}

function operatorFor(path) {
  try {
    const u = new URL(logLabel(path));
    const parts = u.hostname.split(".");
    if (parts.length < 2) return u.hostname;
    return parts.slice(-2).join(".");
  } catch {
    return "(unknown)";
  }
}

async function fetchCsv(path) {
  if (cache.has(path)) return cache.get(path);
  // Filenames on disk contain literal "%2F" etc.; double-encode the "%" so
  // servers that decode the request path once still find the file.
  const url = path.replace(/%/g, "%25");
  const resp = await fetch(url);
  if (!resp.ok) {
    throw new Error(`${resp.status} ${resp.statusText} for ${url}`);
  }
  const text = await resp.text();
  const lines = text.trim().split("\n");
  const header = lines[0].split(",");
  const rows = lines.slice(1).map(line => line.split(",").map((v, i) => i === 0 ? Number(v) : (v === "" ? null : Number(v))));
  const parsed = { header, rows };
  cache.set(path, parsed);
  return parsed;
}

function toLocalInput(unix) {
  const d = new Date(unix * 1000);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function inputToUnix(s) {
  if (!s) return null;
  return Math.floor(new Date(s).getTime() / 1000);
}

// Each range mutates a Date in place, stepping it back from "now".
const RANGES = {
  week: d => d.setDate(d.getDate() - 7),
  month: d => d.setMonth(d.getMonth() - 1),
  "3months": d => d.setMonth(d.getMonth() - 3),
  year: d => d.setFullYear(d.getFullYear() - 1),
};

// Sets To = now and From = now - range. Does not re-render.
function setRange(name) {
  const back = RANGES[name];
  if (!back) return;
  const now = new Date();
  const start = new Date(now);
  back(start);
  fromInp.value = toLocalInput(start.getTime() / 1000);
  toInp.value = toLocalInput(now.getTime() / 1000);
}

async function render() {
  const seq = ++renderSeq;
  clearErrors();
  const hideHigh = hideHighInp.checked;
  const selected = Array.from(selectedLogs);
  if (plot) { plot.destroy(); plot = null; }
  chartDiv.innerHTML = "";
  populateSidebarSwatches();
  updateLogRowStates();
  if (selected.length === 0) return;

  const results = await Promise.all(selected.map(p =>
    fetchCsv(p).then(d => ({ path: p, data: d }), err => ({ path: p, err }))
  ));
  if (seq !== renderSeq) return;
  for (const r of results) {
    if (r.err) showError(`Loading ${logLabel(r.path)}: ${r.err.message}`);
  }
  updateLogRowStates();
  const ok = results.filter(r => r.data);
  if (ok.length === 0) return;
  ok.sort((a, b) => {
    const opCmp = operatorFor(a.path).localeCompare(operatorFor(b.path));
    return opCmp !== 0 ? opCmp : logLabel(a.path).localeCompare(logLabel(b.path));
  });
  const datasets = ok.map(r => r.data);
  const okPaths = ok.map(r => r.path);

  const opCounts = new Map();
  for (const p of okPaths) {
    const op = operatorFor(p);
    opCounts.set(op, (opCounts.get(op) || 0) + 1);
  }
  const opSeen = new Map();

  // Build a union of timestamps across all selected datasets.
  const tsSet = new Set();
  for (const d of datasets) {
    for (const r of d.rows) tsSet.add(r[0]);
  }
  let timestamps = Array.from(tsSet).sort((a, b) => a - b);

  const from = inputToUnix(fromInp.value);
  const to = inputToUnix(toInp.value);
  timestamps = timestamps.filter(t => (from == null || t >= from) && (to == null || t <= to));
  if (timestamps.length === 0) return;

  const xMin = from != null ? from : timestamps[0];
  const xMax = to != null ? to : timestamps[timestamps.length - 1];

  const tsIndex = new Map(timestamps.map((t, i) => [t, i]));

  const series = [{}]; // x-axis placeholder
  const data = [timestamps];
  // Plot positions on the log-downtime axis (range [0.01, 100], i.e. 99.99% .. 0%).
  // 99% (downtime = 1) sits at the geometric center of the axis.
  //   100% uptime, and anything >= 99.99%, clamps to the top gridline (0.01).
  const AXIS_TOP = 0.01;

  for (let di = 0; di < datasets.length; di++) {
    const d = datasets[di];
    const path = okPaths[di];
    const op = operatorFor(path);
    const idxInOp = opSeen.get(op) || 0;
    opSeen.set(op, idxInOp + 1);
    const opSize = opCounts.get(op);
    const label = logLabel(path);
    const rowByTs = new Map(d.rows.map(r => [r[0], r]));
    const color = colorFor(op, idxInOp, opSize);
    const hidden = hiddenFor(path);
    for (let ci = 1; ci < d.header.length; ci++) {
      const endpoint = d.header[ci];
      if (hidden.has(endpoint)) continue;
      const ys = new Array(timestamps.length).fill(null);
      const uptimes = new Array(timestamps.length).fill(null);
      for (const t of timestamps) {
        const r = rowByTs.get(t);
        if (r) {
          const uptime = r[ci];
          if (uptime != null && !(hideHigh && uptime > HIDE_ABOVE)) {
            uptimes[tsIndex.get(t)] = uptime;
            ys[tsIndex.get(t)] = Math.max(AXIS_TOP, 100 - uptime);
          }
        }
      }
      series.push({
        label: `${label} ${endpoint}`,
        stroke: color,
        // Normally gaps just mean "this log has no sample at that timestamp", so
        // bridge them. While filtering, gaps are the hidden samples themselves,
        // so leave them open rather than drawing lines through hidden data.
        spanGaps: !hideHigh,
        _path: path,
        _endpoint: endpoint,
        _uptimes: uptimes,
        _color: color,
      });
      data.push(ys);
    }
  }

  let focusedIdx = null;
  const tooltip = document.createElement("div");
  tooltip.className = "chart-tooltip";

  const opts = {
    width: chartDiv.clientWidth || 900,
    height: chartDiv.clientHeight || 500,
    series,
    legend: { show: false },
    cursor: {
      focus: { prox: 30 },
    },
    scales: {
      x: { time: true, range: [xMin, xMax] },
      y: { distr: 3, log: 10, dir: -1, range: [0.01, 100] },
    },
    axes: [{
      values: [
        // [tick incr (s), default,       year,                            month, day,                          hour, min,              sec, mode]
        [3600 * 24 * 365,  "{YYYY}",      null,                            null,  null,                         null, null,             null, 1],
        [3600 * 24 * 28,   "{MMM}",       "\n{YYYY}",                      null,  null,                         null, null,             null, 1],
        [3600 * 24,        "{YYYY}-{MM}-{DD}", null,                       null,  null,                         null, null,             null, 1],
        [3600,             "{h}{aa}",     "\n{YYYY}-{MM}-{DD}",            null,  "\n{YYYY}-{MM}-{DD}",         null, null,             null, 1],
        [60,               "{h}:{mm}{aa}","\n{YYYY}-{MM}-{DD}",            null,  "\n{YYYY}-{MM}-{DD}",         null, null,             null, 1],
        [1,                ":{ss}",       "\n{YYYY}-{MM}-{DD} {h}{aa}",    null,  "\n{YYYY}-{MM}-{DD} {h}{aa}", null, "\n{h}:{mm}{aa}", null, 1],
      ],
    }, {
      size: 70,
      splits: () => [0.01, 0.1, 1, 10, 100],
      values: (u, splits) => splits.map(t => {
        const up = 100 - t;
        if (up <= 0) return "0%";
        return parseFloat(up.toPrecision(6)) + "%";
      }),
    }],
    hooks: {
      ready: [u => {
        u.over.appendChild(tooltip);
        u.over.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
      }],
      drawAxes: [u => {
        // 99% SLA target line (y=1 on the log-downtime axis).
        const ctx = u.ctx;
        const yPos = Math.round(u.valToPos(1, "y", true)) + 0.5;
        ctx.save();
        ctx.strokeStyle = "#c00";
        ctx.lineWidth = 4;
        ctx.setLineDash([10, 8]);
        ctx.beginPath();
        ctx.moveTo(u.bbox.left, yPos);
        ctx.lineTo(u.bbox.left + u.bbox.width, yPos);
        ctx.stroke();
        ctx.restore();
      }],
      setSeries: [(u, sidx, o) => {
        if (o.focus !== undefined) {
          focusedIdx = o.focus ? sidx : (focusedIdx === sidx ? null : focusedIdx);
          updateTooltip(u);
        }
      }],
      setCursor: [updateTooltip],
    },
  };

  function updateTooltip(u) {
    if (focusedIdx == null || u.cursor.left == null || u.cursor.left < 0) {
      tooltip.style.display = "none";
      return;
    }
    const idx = u.cursor.idx;
    if (idx == null) { tooltip.style.display = "none"; return; }
    const s = u.series[focusedIdx];
    const uptime = s._uptimes ? s._uptimes[idx] : null;
    if (uptime == null) { tooltip.style.display = "none"; return; }
    const ts = u.data[0][idx];
    tooltip.innerHTML = "";
    const tsRow = document.createElement("div");
    tsRow.className = "tt-row";
    tsRow.textContent = new Date(ts * 1000).toLocaleString();
    const logRow = document.createElement("div");
    logRow.className = "tt-row";
    const sw = document.createElement("span");
    sw.className = "tt-swatch";
    sw.style.background = s._color;
    const logText = document.createElement("span");
    logText.textContent = logLabel(s._path);
    logRow.append(sw, logText);
    const epRow = document.createElement("div");
    epRow.className = "tt-row";
    epRow.textContent = `${s._endpoint}: ${formatUptime(uptime)}`;
    tooltip.append(tsRow, logRow, epRow);
    tooltip.style.border = `2px solid ${s._color}`;
    tooltip.style.display = "block";
    const ttW = tooltip.offsetWidth;
    const ttH = tooltip.offsetHeight;
    const overW = u.over.clientWidth;
    const overH = u.over.clientHeight;
    let left = u.cursor.left + 14;
    let top = u.cursor.top + 14;
    if (left + ttW > overW) left = u.cursor.left - ttW - 14;
    if (top + ttH > overH) top = u.cursor.top - ttH - 14;
    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
  }

  plot = new uPlot(opts, data, chartDiv);
  populateSidebarSwatches();
}

function formatUptime(up) {
  if (up >= 100) return "100%";
  return parseFloat(up.toPrecision(8)) + "%";
}

function populateSidebarSwatches() {
  logsList.querySelectorAll(".swatches").forEach(el => { el.innerHTML = ""; });
  if (!plot) return;
  const byPath = new Map();
  for (let i = 1; i < plot.series.length; i++) {
    const s = plot.series[i];
    if (!s._path || byPath.has(s._path)) continue;
    byPath.set(s._path, s._color);
  }
  for (const [path, color] of byPath) {
    const row = logsList.querySelector(`.log-row[data-path="${CSS.escape(path)}"] .swatches`);
    if (!row) continue;
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = color;
    row.appendChild(sw);
  }
}

function hueForOperator(op) {
  let h = 5381;
  for (let i = 0; i < op.length; i++) h = ((h << 5) + h + op.charCodeAt(i)) >>> 0;
  return h % 360;
}

function colorFor(op, logIdxInOp, opSize) {
  const hue = hueForOperator(op);
  const logT = opSize > 1 ? logIdxInOp / (opSize - 1) : 0.5;
  const L = 0.45 + 0.28 * logT;
  const C = 0.22 - 0.10 * logT;
  return `oklch(${L.toFixed(3)} ${C.toFixed(3)} ${hue})`;
}

async function init() {
  const resp = await fetch("index.json");
  if (!resp.ok) {
    showError(`Loading index.json: ${resp.status} ${resp.statusText}`);
    return;
  }
  const idx = await resp.json();
  allLogPaths = Object.keys(idx).sort();
  operatorGroups = groupByOperator(allLogPaths);

  let stored = null;
  try {
    const raw = localStorage.getItem(SELECTED_LOGS_KEY);
    if (raw != null) stored = JSON.parse(raw);
  } catch {}
  if (Array.isArray(stored)) {
    const known = new Set(allLogPaths);
    for (const p of stored) if (known.has(p)) selectedLogs.add(p);
  } else {
    for (const p of allLogPaths) selectedLogs.add(p);
    saveSelection();
  }
  let storedHidden = null;
  try {
    const raw = localStorage.getItem(HIDDEN_ENDPOINTS_KEY);
    if (raw != null) storedHidden = JSON.parse(raw);
  } catch {}
  if (storedHidden && typeof storedHidden === "object") {
    for (const [p, eps] of Object.entries(storedHidden)) {
      if (selectedLogs.has(p) && Array.isArray(eps) && eps.length) hiddenEndpoints.set(p, new Set(eps));
    }
  }
  setRange("week");
  try { hideHighInp.checked = localStorage.getItem(HIDE_HIGH_KEY) === "1"; } catch {}
  renderLogsList();
  updateLogsHeading();
  render();

  document.getElementById("range-links").addEventListener("click", e => {
    const a = e.target.closest("a[data-range]");
    if (!a) return;
    setRange(a.dataset.range);
    render();
  });
  hideHighInp.addEventListener("change", () => {
    try { localStorage.setItem(HIDE_HIGH_KEY, hideHighInp.checked ? "1" : "0"); } catch {}
    render();
  });
  document.getElementById("logs-all").addEventListener("click", () => {
    for (const p of allLogPaths) setLogSelected(p, true);
    selectionChanged();
  });
  document.getElementById("logs-none").addEventListener("click", () => {
    for (const p of allLogPaths) setLogSelected(p, false);
    selectionChanged();
  });
  fromInp.addEventListener("change", render);
  toInp.addEventListener("change", render);
  window.addEventListener("resize", render);
}

init();
</script>
